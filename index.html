<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koreksi Warna</title>
<style>
:root{--bg:#1d1f22;--panel:#26292d;--line:#3a3e44;--text:#e6e4df;--mute:#9a9ca0;--accent:#6fb1a0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;font-weight:600;margin:0 auto 0 0}
button,label.btn{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#13211d;font-weight:600}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-width:0;position:relative}
#cv{max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line);display:none}
#empty{text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:48px 32px;max-width:340px}
#stage.drag #empty{border-color:var(--accent);color:var(--text)}
aside{width:300px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:6px 16px 20px}
h2{font-size:13px;font-weight:600;margin:18px 0 6px;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 44px;gap:2px 8px;align-items:center;margin:8px 0}
.row span{grid-column:1}
.row output{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.row input{grid-column:1/3;width:100%;accent-color:var(--accent)}
#msg{font-size:12px;color:var(--mute);padding:8px 14px;border-top:1px solid var(--line)}
@media(max-width:760px){main{flex-direction:column}aside{width:100%;border-left:0;border-top:1px solid var(--line);max-height:45%}}
</style>
</head>
<body>
<header>
  <h1>Koreksi Warna</h1>
  <label class="btn">Buka foto<input id="file" type="file" accept="image/*" hidden></label>
  <button id="cmp" disabled>Tahan untuk lihat asli</button>
  <button id="reset" disabled>Reset</button>
  <button id="save" class="primary" disabled>Simpan JPG</button>
</header>
<main>
  <div id="stage">
    <div id="empty">Tarik foto ke sini atau klik Buka foto.<br>Foto diproses di browser dan tidak diunggah ke mana pun.</div>
    <canvas id="cv"></canvas>
  </div>
  <aside id="panel"></aside>
</main>
<div id="msg">Siap.</div>

<script>
const CONTROLS = [
  ["Cahaya", [
    ["exposure","Exposure",-3,3,0.01],["contrast","Contrast",-1,1,0.01],
    ["highlights","Highlights",-1,1,0.01],["shadows","Shadows",-1,1,0.01]]],
  ["Warna", [
    ["temp","Temperature",-1,1,0.01],["tint","Tint",-1,1,0.01],
    ["vibrance","Vibrance",-1,1,0.01],["sat","Saturation",-1,1,0.01]]]
];
const state = {};
const panel = document.getElementById("panel");
CONTROLS.forEach(([title, items]) => {
  const h = document.createElement("h2"); h.textContent = title; panel.appendChild(h);
  items.forEach(([id,label,min,max,step]) => {
    state[id] = 0;
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<span>${label}</span><output id="o_${id}">0</output><input id="s_${id}" type="range" min="${min}" max="${max}" step="${step}" value="0" aria-label="${label}">`;
    panel.appendChild(r);
    const s = r.querySelector("input");
    s.addEventListener("input", () => { state[id] = +s.value; r.querySelector("output").textContent = (+s.value).toFixed(2); draw(); });
    s.addEventListener("dblclick", () => { s.value = 0; s.dispatchEvent(new Event("input")); });
  });
});

const cv = document.getElementById("cv");
const gl = cv.getContext("webgl", {preserveDrawingBuffer:true, premultipliedAlpha:false});
const msg = t => document.getElementById("msg").textContent = t;
let loaded = false, bypass = false;

const VS = `attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS = `precision highp float;varying vec2 v;uniform sampler2D t;
uniform float exposure,contrast,highlights,shadows,temp,tint,vibrance,sat;
void main(){
  vec3 c=texture2D(t,v).rgb;
  c=pow(c,vec3(2.2))*pow(2.,exposure); c=pow(clamp(c,0.,8.),vec3(1./2.2));
  c.r+=temp*.12; c.b-=temp*.12; c.g-=tint*.08; c.r+=tint*.04; c.b+=tint*.04;
  float l=dot(c,vec3(.2126,.7152,.0722));
  float sh=pow(1.-clamp(l,0.,1.),2.), hi=pow(clamp(l,0.,1.),2.);
  c+=shadows*.3*sh*(1.-l*.5); c+=highlights*.3*hi;
  c=(c-.5)*(1.+contrast)+.5;
  l=dot(c,vec3(.2126,.7152,.0722));
  float mx=max(c.r,max(c.g,c.b)), mn=min(c.r,min(c.g,c.b));
  float vb=vibrance*(1.-(mx-mn));
  c=mix(vec3(l),c,1.+sat+vb);
  gl_FragColor=vec4(clamp(c,0.,1.),1.);
}`;
function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let prog, U = {};
if (!gl) { msg("Browser tidak mendukung WebGL."); }
else {
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,"p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  Object.keys(state).forEach(k => U[k] = gl.getUniformLocation(prog,k));
}

function draw(){
  if(!loaded) return;
  gl.viewport(0,0,cv.width,cv.height);
  for(const k in U) gl.uniform1f(U[k], bypass ? 0 : state[k]);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

function loadImage(file){
  if(!file || !file.type.startsWith("image/")) { msg("File harus berupa gambar (JPG, PNG, WebP)."); return; }
  const img = new Image();
  img.onload = () => {
    const max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    const k = Math.min(1, max/Math.max(img.width,img.height));
    cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
    [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(f=>gl.texParameteri(gl.TEXTURE_2D,f,gl.LINEAR));
    [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(f=>gl.texParameteri(gl.TEXTURE_2D,f,gl.CLAMP_TO_EDGE));
    loaded = true; cv.style.display = "block"; document.getElementById("empty").style.display = "none";
    ["cmp","reset","save"].forEach(i=>document.getElementById(i).disabled=false);
    msg(`${file.name}, ${cv.width}×${cv.height}px. Klik dua kali slider untuk mengembalikan ke 0.`);
    draw(); URL.revokeObjectURL(img.src);
  };
  img.onerror = () => msg("Foto tidak bisa dibuka. Coba format JPG atau PNG.");
  img.src = URL.createObjectURL(file);
}

document.getElementById("file").addEventListener("change", e => loadImage(e.target.files[0]));
const stage = document.getElementById("stage");
stage.addEventListener("dragover", e => { e.preventDefault(); stage.classList.add("drag"); });
stage.addEventListener("dragleave", () => stage.classList.remove("drag"));
stage.addEventListener("drop", e => { e.preventDefault(); stage.classList.remove("drag"); loadImage(e.dataTransfer.files[0]); });

const cmp = document.getElementById("cmp");
const hold = v => () => { bypass = v; draw(); };
["pointerdown"].forEach(ev => cmp.addEventListener(ev, hold(true)));
["pointerup","pointerleave","pointercancel"].forEach(ev => cmp.addEventListener(ev, hold(false)));

document.getElementById("reset").addEventListener("click", () => {
  document.querySelectorAll("#panel input").forEach(s => { s.value = 0; s.dispatchEvent(new Event("input")); });
});
document.getElementById("save").addEventListener("click", () => {
  bypass = false; draw();
  cv.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "hasil-koreksi.jpg"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); msg("Foto tersimpan."); }, "image/jpeg", 0.95);
});
</script>
</body>
</html>
