<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstantManiaRetoucher</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header>
  <h1>InstantMania<span style="color:var(--accent)">Retoucher</span></h1>
  <label class="btn">Buka foto<input id="file" type="file" multiple hidden accept="image/*,.cr2,.cr3,.crw,.raf,.nef,.nrw,.arw,.sr2,.srf,.dng,.orf,.rw2,.pef,.srw,.3fr,.erf,.mrw,.kdc,.dcr,.raw"></label>
  <button id="rot" disabled>Putar</button>
  <button id="cmp" disabled>Tahan untuk lihat asli</button>
  <button id="reset" disabled>Reset</button>
  <select id="fmt" aria-label="Format ekspor"><option value="png">PNG (lossless)</option><option value="jpg">JPG kualitas 100%</option></select>
  <button id="save" disabled>EXPORT</button>
  <button id="expall" class="primary" disabled>BATCH EXPORT</button>
</header>
<main>
  <div id="stage">
    <div id="view">
      <div id="empty">Tarik foto ke sini atau klik Buka foto.<br>Bisa banyak sekaligus: JPG, PNG, WebP, dan RAW (CR2, CR3, RAF, NEF, ARW, DNG, dll).<br>Semua diproses di browser, tidak ada yang diunggah.</div>
      <div id="zw"><canvas id="cv"></canvas><canvas id="out"></canvas><canvas id="ov"></canvas></div>
    </div>
    <div id="bar"><span id="cnt">0 foto</span><span id="zl" title="Scroll untuk zoom, seret untuk geser, klik dua kali untuk Fit"></span><button id="zfit" title="Pas ke layar">Fit</button><button id="z100" title="Ukuran piksel asli">100%</button><button id="syncb" disabled>Terapkan ke foto tercentang</button><button id="chk" disabled>Centang semua / kosongkan</button></div>
    <div id="strip"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="msg">Siap.</div>

<script src="core.js?v=4"></script>
<script src="background.js?v=3"></script>
<script src="raw.js?v=3"></script>
<script src="photos.js?v=3"></script>
<script src="export.js?v=3"></script>
<script src="face.js?v=3"></script>
<script src="zoom.js?v=3"></script>
<script src="main.js?v=3"></script>
<script src="shader.js?v=5"></script>
<script src="gl.js?v=5"></script>
<script src="logger.js?v=6"></script>
<script src="store.js?v=2"></script>

</body>
</html>
