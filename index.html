<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstantRetoucher</title>
<style>
:root{--bg:#0e0e0e;--panel:#171717;--line:#2e2a26;--text:#f1ebe4;--mute:#a09488;--accent:#ff7a1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;font-weight:700;letter-spacing:.2px;margin:0 auto 0 0}
button,label.btn{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover:not(:disabled),label.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#140a02;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within,.th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;display:flex;flex-direction:column;padding:12px;min-width:0}
#view{flex:1;min-height:0;position:relative}
#cv,#out{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line);display:none}
#empty{position:absolute;inset:0;margin:auto;height:max-content;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:40px 28px;max-width:360px}
#stage.drag #empty{border-color:var(--accent);color:var(--text)}
#strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px}
.th{position:relative;flex:0 0 auto;width:84px;height:64px;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;background:#000}
.th.sel{border-color:var(--accent)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th input{position:absolute;top:3px;left:3px;accent-color:var(--accent)}
#ov{position:absolute;display:none;touch-action:none;cursor:crosshair}
aside{width:300px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:6px 16px 20px}
h2{font-size:13px;font-weight:600;margin:18px 0 6px;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 44px;gap:2px 8px;align-items:center;margin:8px 0}
.row output{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.row input{grid-column:1/3;width:100%;accent-color:var(--accent)}
#msg{font-size:12px;color:var(--mute);padding:8px 14px;border-top:1px solid var(--line)}
[hidden]{display:none!important}
.field{display:flex;gap:8px;align-items:center;margin:8px 0}
.field select,.field input[type=color]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
.field input[type=color]{padding:0;width:40px;height:30px}
aside button.w{width:100%;margin-top:6px}
@media(max-width:760px){main{flex-direction:column}aside{width:100%;border-left:0;border-top:1px solid var(--line);max-height:45%}}

aside{width:290px;padding:0 14px 20px}
header button,header label.btn{border-color:transparent;background:#1c1c1c}
header button.primary{background:var(--accent);border-color:var(--accent)}
.sec{border-bottom:1px solid var(--line)}
.sec>summary{display:flex;align-items:center;list-style:none;cursor:pointer;padding:12px 2px;font-weight:600;font-size:13px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"\203A";display:inline-block;width:14px;color:var(--mute)}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec>summary span{margin-right:auto}
.sec .rs{border:0;padding:2px 6px;color:var(--mute);font-size:15px;background:transparent}
.sec .body{padding:0 2px 12px}
.row{margin:6px 0 2px}
.row span{font-size:13px}
.row output{color:var(--text)}
.row.sub{padding-left:12px}.row.sub span{color:var(--mute)}
.row input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--tr,#3a3a3a);margin:7px 0 13px;accent-color:initial}
.row input[type=range]::-webkit-slider-runnable-track{height:4px;background:transparent}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:10px;margin-top:6px;background:#d8d2cb;clip-path:polygon(50% 0,100% 100%,0 100%);border:0}
.row input[type=range]::-moz-range-track{background:transparent;height:4px}
.row input[type=range]::-moz-range-thumb{width:11px;height:10px;background:#d8d2cb;border:0;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.row input[type=range]:hover::-webkit-slider-thumb{background:var(--accent)}
.row input[type=range]:hover::-moz-range-thumb{background:var(--accent)}
.sec button.w{margin:4px 0}
#bar{display:flex;gap:8px;align-items:center;padding:8px 2px 0;color:var(--mute);font-size:12px}
#bar span{margin-right:auto}
#bar button{padding:4px 10px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Instant<span style="color:var(--accent)">Retoucher</span></h1>
  <label class="btn">Buka foto<input id="file" type="file" multiple hidden accept="image/*,.cr2,.cr3,.crw,.raf,.nef,.nrw,.arw,.sr2,.srf,.dng,.orf,.rw2,.pef,.srw,.3fr,.erf,.mrw,.kdc,.dcr,.raw"></label>
  <button id="rot" disabled>Putar</button>
  <button id="cmp" disabled>Tahan untuk lihat asli</button>
  <button id="reset" disabled>Reset</button>
  <button id="save" disabled>Simpan foto ini</button>
  <button id="zip" class="primary" disabled>Ekspor ZIP</button>
</header>
<main>
  <div id="stage">
    <div id="view">
      <div id="empty">Tarik foto ke sini atau klik Buka foto.<br>Bisa banyak sekaligus: JPG, PNG, WebP, dan RAW (CR2, CR3, RAF, NEF, ARW, DNG, dll).<br>Semua diproses di browser, tidak ada yang diunggah.</div>
      <canvas id="cv"></canvas><canvas id="out"></canvas><canvas id="ov"></canvas>
    </div>
    <div id="bar"><span id="cnt">0 foto</span><button id="syncb" disabled>Terapkan ke foto tercentang</button><button id="chk" disabled>Centang semua / kosongkan</button></div>
    <div id="strip"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="msg">Siap.</div>

<script>
const TR={temp:"linear-gradient(90deg,#2d5be0,#8e8e8e 50%,#f0c419)",tint:"linear-gradient(90deg,#2fa84f,#8e8e8e 50%,#cc3fc4)",
 vibrance:"linear-gradient(90deg,#6f7378,#8a8f9a 40%,#c9605a 75%,#e8b13a)",sat:"linear-gradient(90deg,#808080,#5a8fdc 35%,#e0b04a 70%,#e2503c)"};
const SECS=[
 ["Cahaya",1,[["exposure","Exposure",-3,3],["contrast","Contrast",-1,1],["highlights","Highlights",-1,1],["shadows","Shadows",-1,1],["whites","Whites",-1,1],["blacks","Blacks",-1,1]]],
 ["Warna",1,[["temp","Temperature",-1,1],["tint","Tint",-1,1],["vibrance","Vibrance",-1,1],["sat","Saturation",-1,1]]],
 ["Efek",0,[["fine","Texture",-1,1],["clarity","Clarity",-1,1],["dehaze","Dehaze",-1,1],["vig","Vignette",-1,1],
   ["vmid","Midpoint",0,1,.5,1],["vround","Roundness",-1,1,0,1],["vfeather","Feather",0,1,.5,1],["vhi","Highlights",0,1,0,1],["grain","Grain",0,1],["gsize","Ukuran grain",0,1,.25,1]]],
 ["Kulit",0,[["skin","Haluskan kulit",0,1],["keep","Pertahankan tekstur",0,1,.6]]],
 ["Mata & mulut",0,[["eyes","Cerahkan mata",0,1],["teeth","Putihkan gigi",0,1]]]
];
const IDS=SECS.flatMap(g=>g[2].map(r=>r[0]));
const DEF={};SECS.forEach(g=>g[2].forEach(r=>DEF[r[0]]=r[4]||0));const zero=()=>({...DEF});
const disp=(id,v)=>id==="exposure"?(+v).toFixed(2):Math.round(v*100);
const $=id=>document.getElementById(id), msg=t=>$("msg").textContent=t;
const RAW=/\.(cr2|cr3|crw|raf|nef|nrw|arw|srf|sr2|dng|orf|rw2|pef|srw|3fr|erf|mrw|kdc|dcr|raw)$/i;
const photos=[], wc=document.createElement("canvas"), cv=$("cv"), out=$("out"), panel=$("panel");
let cur=null, idx=-1, bypass=false, busy=false, tex=null, seg=null, tok=0, mtex=null, mown=null, lm=null;

/* ---------- Panel ---------- */
SECS.forEach(([title,open,items])=>{
  const d=document.createElement("details");d.className="sec";d.open=!!open;
  d.innerHTML=`<summary><span>${title}</span><button class="rs" title="Reset bagian ini" aria-label="Reset ${title}">&#10226;</button></summary><div class="body"></div>`;
  const body=d.querySelector(".body");
  items.forEach(([id,label,min,max,def=0,sub])=>{
    body.insertAdjacentHTML("beforeend",`<div class="row${sub?" sub":""}"><span>${label}</span><output id="o_${id}">${disp(id,def)}</output><input id="s_${id}" type="range" min="${min}" max="${max}" step="0.01" value="${def}" style="--tr:${TR[id]||"#3a3a3a"}" aria-label="${label}"></div>`);
    const sl=body.querySelector("#s_"+id);
    sl.addEventListener("input",()=>{if(!cur)return;cur.s[id]=+sl.value;$("o_"+id).textContent=disp(id,+sl.value);
      if(["skin","teeth","eyes"].includes(id)&&+sl.value>0&&!cur.faces&&!busy)ensureFaces(cur).then(()=>draw());draw();});
    sl.addEventListener("dblclick",()=>{sl.value=def;sl.dispatchEvent(new Event("input"));});
  });
  d.querySelector(".rs").onclick=e=>{e.preventDefault();e.stopPropagation();if(!cur)return;items.forEach(r=>{cur.s[r[0]]=r[4]||0;});syncUI();draw();};
  panel.appendChild(d);
});
panel.insertAdjacentHTML("beforeend",`
  <details class="sec"><summary><span>Kilau kacamata</span></summary><div class="body">
    <button id="gfix" class="w" disabled>Hapus kilau otomatis</button>
    <div class="row"><span>Ambang kilau (turunkan = lebih banyak)</span><output id="o_gt">0.88</output><input id="gthr" type="range" min="0.6" max="0.99" step="0.01" value="0.88" aria-label="Ambang kilau"></div>
    <button id="gbrush" class="w" disabled>Kuas kilau: mati</button>
    <div class="row"><span>Ukuran kuas</span><output id="o_gs">3</output><input id="gsize" type="range" min="0.5" max="10" step="0.5" value="3" aria-label="Ukuran kuas"></div>
    <button id="gclear" class="w" disabled>Batalkan perbaikan kilau</button>
  </div></details>
  <details class="sec"><summary><span>Latar</span></summary><div class="body">
    <button id="rmbg" class="w" disabled>Pisahkan subjek (AI)</button>
    <button id="rmall" class="w" disabled>Pisahkan semua yang tercentang</button>
    <div id="bgopts" hidden>
      <div class="field"><select id="bgmode" aria-label="Jenis latar">
        <option value="transparent">Transparan</option><option value="color">Warna</option>
        <option value="image">Gambar</option><option value="original">Latar asli</option></select>
        <input id="bgcolor" type="color" value="#ffffff" aria-label="Warna latar">
        <label class="btn">Gambar<input id="bgimg" type="file" accept="image/*" hidden></label></div>
      <div class="row"><span>Haluskan tepi</span><output id="o_f">1</output>
        <input id="feather" type="range" min="0" max="8" step="0.5" value="1" aria-label="Haluskan tepi"></div>
    </div>
  </div></details>`);

/* ---------- WebGL ---------- */
const gl=cv.getContext("webgl",{preserveDrawingBuffer:true,premultipliedAlpha:false});
const VS=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;varying vec2 v;uniform sampler2D t;
uniform sampler2D mk;uniform float hasMask,asp,faceW,skin,keep,teeth,eyes;
uniform float exposure,contrast,highlights,shadows,whites,blacks,temp,tint,vibrance,sat;
uniform float fine,clarity,dehaze,vig,vmid,vround,vfeather,vhi,grain,gsize;
uniform vec2 res;
const vec3 LW=vec3(.2126,.7152,.0722);
vec3 blurAt(float rad){
  vec3 s=vec3(0.);
  for(int i=0;i<16;i++){float fi=float(i)+.5,a=fi*2.39996,r=sqrt(fi/16.)*rad;
    s+=texture2D(t,v+vec2(cos(a),sin(a)*asp)*r).rgb;}
  return s/16.;
}
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  vec3 c=texture2D(t,v).rgb, c0=c;
  if(hasMask>.5){
    vec3 m=texture2D(mk,v).rgb;
    float sm=skin*m.r;
    if(sm>.003){
      float rad=faceW*(.008+.012*skin), sg=.05+.12*skin;
      vec3 acc=vec3(0.),pl=vec3(0.);float ws=0.;
      for(int i=0;i<24;i++){
        float fi=float(i)+.5, a=fi*2.39996, r=sqrt(fi/24.)*rad;
        vec3 s=texture2D(t,v+vec2(cos(a),sin(a)*asp)*r).rgb;
        float d=distance(s,c), w=exp(-d*d/(2.*sg*sg));
        acc+=s*w; ws+=w; pl+=s;
      }
      vec3 sb=acc/ws, lp=pl/24.;
      c=mix(c,clamp(sb+(c-lp)*keep,0.,1.),sm);
    }
    float l0=dot(c,LW);
    float red=c.r-.5*(c.g+c.b);
    float tw=teeth*m.g*smoothstep(.25,.45,l0)*(1.-smoothstep(.06,.18,red));
    c=mix(c,mix(vec3(l0),c,.5)*(1.+.2*teeth),tw);
    c=mix(c,c*1.2+.03,eyes*m.b*smoothstep(.4,.75,l0));
  }
  c=pow(c,vec3(2.2))*pow(2.,exposure); c=pow(clamp(c,0.,8.),vec3(1./2.2));
  c.r+=temp*.12; c.b-=temp*.12; c.g-=tint*.08; c.r+=tint*.04; c.b+=tint*.04;
  float l=dot(c,LW);
  float sh=pow(1.-clamp(l,0.,1.),2.), hi=pow(clamp(l,0.,1.),2.);
  c+=shadows*.3*sh*(1.-l*.5); c+=highlights*.3*hi;
  c+=whites*.2*smoothstep(.55,1.,l); c+=blacks*.2*(1.-smoothstep(0.,.45,l));
  c=(c-.5)*(1.+contrast)+.5;
  float lm0=dot(c0,LW);
  if(abs(fine)>.003) c+=(lm0-dot(blurAt(.0015),LW))*fine*1.5;
  if(abs(clarity)>.003) c+=(lm0-dot(blurAt(.012),LW))*clarity*1.3*clamp(1.-abs(l-.5)*1.6,0.,1.);
  if(abs(dehaze)>.003){
    vec3 A=vec3(.92);
    if(dehaze>0.){float tr=max(1.-.8*dehaze*min(c.r,min(c.g,c.b))/.92,.25);c=(c-A)/tr+A;}
    else c=mix(c,A,-dehaze*.35);
  }
  l=dot(c,LW);
  float mx=max(c.r,max(c.g,c.b)), mn=min(c.r,min(c.g,c.b));
  float skinw=(c.r>c.g&&c.g>c.b)?smoothstep(.15,.35,c.r):0.;
  c=mix(vec3(l),c,1.+sat+vibrance*(1.-(mx-mn))*(1.-.5*skinw));
  if(abs(vig)>.003){
    vec2 q=(v-.5)*2.; float rd=max(vround,0.);
    vec2 qq=vec2(q.x*mix(1.,asp,rd),q.y)/mix(1.,max(asp,1.),rd);
    float pw=mix(2.,5.,max(-vround,0.));
    float d=pow(pow(abs(qq.x),pw)+pow(abs(qq.y),pw),1./pw);
    float s0=mix(.1,1.1,vmid), vm=smoothstep(s0,s0+mix(.05,1.,vfeather),d);
    float prot=1.-vhi*smoothstep(.5,1.,dot(c,LW));
    if(vig<0.) c*=1.+vig*vm*prot; else c=mix(c,vec3(1.),vig*vm*prot*.8);
  }
  if(grain>.003){
    float cell=max(1.,res.x/2200.*mix(1.,3.5,gsize)); vec2 g=floor(v*res/cell);
    float n=hash(g)+hash(g+17.3)-1.; float lg=dot(c,LW);
    c+=n*grain*.22*(1.-pow(abs(lg*2.-1.),2.)*.7);
  }
  gl_FragColor=vec4(clamp(c,0.,1.),1.);
}`;
const U={}; let MAXT=4096;
if(!gl) msg("Browser tidak mendukung WebGL.");
else{
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};
  const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,"p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  IDS.forEach(k=>U[k]=gl.getUniformLocation(pr,k)); MAXT=gl.getParameter(gl.MAX_TEXTURE_SIZE);
  ["hasMask","asp","faceW","res"].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
  gl.uniform1i(gl.getUniformLocation(pr,"t"),0); gl.uniform1i(gl.getUniformLocation(pr,"mk"),1); mtex=gl.createTexture();
}

function draw(p=cur){
  if(!p||!tex)return;
  gl.viewport(0,0,cv.width,cv.height);
  const off=bypass&&p===cur;
  if(mown!==p.fmask){
    mown=p.fmask;gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,mtex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    if(p.fmask)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,p.fmask);
    else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4));
    [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(f=>gl.texParameteri(gl.TEXTURE_2D,f,gl.LINEAR));
    [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(f=>gl.texParameteri(gl.TEXTURE_2D,f,gl.CLAMP_TO_EDGE));
    gl.activeTexture(gl.TEXTURE0);
  }
  gl.uniform1f(U.hasMask,p.fmask?1:0);gl.uniform1f(U.asp,cv.width/cv.height);gl.uniform1f(U.faceW,p.faceW||.3);gl.uniform2f(U.res,cv.width,cv.height);
  IDS.forEach(k=>gl.uniform1f(U[k],off?0:p.s[k]));
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4); composite(p);
}

async function show(p,cap,tk){
  const bm=await createImageBitmap(p.blob,{imageOrientation:"from-image"});
  if(tk!==undefined&&tk!==tok){bm.close();return;}
  const odd=p.rot%2, sw=odd?bm.height:bm.width, sh=odd?bm.width:bm.height;
  const k=Math.min(1,Math.min(cap,MAXT)/Math.max(sw,sh));
  wc.width=Math.round(sw*k); wc.height=Math.round(sh*k);
  const c=wc.getContext("2d"); c.translate(wc.width/2,wc.height/2); c.rotate(p.rot*Math.PI/2);
  c.drawImage(bm,-bm.width*k/2,-bm.height*k/2,bm.width*k,bm.height*k); bm.close();
  const G=p.glare.auto||p.glare.strokes.length;
  if(G||p.s.skin>0||p.s.teeth>0||p.s.eyes>0){await ensureFaces(p);if(tk!==undefined&&tk!==tok)return;}
  if(G)applyGlare(p);
  cv.width=wc.width; cv.height=wc.height;
  if(tex)gl.deleteTexture(tex); tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,wc);
  [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(f=>gl.texParameteri(gl.TEXTURE_2D,f,gl.LINEAR));
  [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(f=>gl.texParameteri(gl.TEXTURE_2D,f,gl.CLAMP_TO_EDGE));
  draw(p);
}

/* ---------- Background compositing ---------- */
let bgImg=null;
function composite(p){
  if(!p.mask){out.style.display="none";cv.style.display="block";return;}
  const W=out.width=cv.width,H=out.height=cv.height,o=out.getContext("2d"),mode=$("bgmode").value;
  o.clearRect(0,0,W,H);
  out.style.background=mode==="transparent"?"repeating-conic-gradient(#2a2a2a 0 25%,#1c1c1c 0 50%) 0 0/20px 20px":"none";
  if(mode==="original")o.drawImage(cv,0,0);
  else{
    if(mode==="color"){o.fillStyle=$("bgcolor").value;o.fillRect(0,0,W,H);}
    else if(mode==="image"&&bgImg){const k=Math.max(W/bgImg.width,H/bgImg.height),w=bgImg.width*k,h=bgImg.height*k;o.drawImage(bgImg,(W-w)/2,(H-h)/2,w,h);}
    const t=document.createElement("canvas");t.width=W;t.height=H;
    const c=t.getContext("2d");c.drawImage(cv,0,0);
    c.globalCompositeOperation="destination-in";c.filter=`blur(${$("feather").value}px)`;c.drawImage(p.mask,0,0,W,H);
    o.drawImage(t,0,0);
  }
  cv.style.display="none";out.style.display="block";
}
["bgmode","bgcolor","feather"].forEach(id=>$(id).addEventListener("input",()=>{$("o_f").textContent=$("feather").value;draw();}));
$("bgimg").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{bgImg=im;$("bgmode").value="image";draw();};im.src=URL.createObjectURL(f);});

async function segment(p){
  try{
    if(!seg){
      msg("Memuat model AI. Pertama kali butuh unduhan puluhan MB, setelah itu tersimpan di browser.");

/* ---------- RAW: ambil JPEG preview terbesar di dalam file ---------- */
function jpegEnd(b,s){
  let p=s+2;const n=b.length;
  while(p+4<n){
    if(b[p]!==0xFF)return -1;
    const m=b[p+1];
    if(m===0xFF){p++;continue;}
    if(m===0xD9)return p+2;
    if(m===0x01||(m>=0xD0&&m<=0xD8)){p+=2;continue;}
    p+=2+((b[p+2]<<8)|b[p+3]);
    if(m===0xDA){
      while(p+1<n){
        if(b[p]===0xFF){const q=b[p+1];if(q===0xD9)return p+2;if(q!==0&&q!==0xFF&&!(q>=0xD0&&q<=0xD7))break;}
        p++;
      }
    }
  }
  return -1;
}
function extractJpeg(b){
  let best=null;
  for(let i=0;i<b.length-3;i++){
    if(b[i]===0xFF&&b[i+1]===0xD8&&b[i+2]===0xFF){
      const e=jpegEnd(b,i);
      if(e>0){if(!best||e-i>best[1]-best[0])best=[i,e];i=e-1;}
    }
  }
  return best&&best[1]-best[0]>20000?new Blob([b.subarray(best[0],best[1])],{type:"image/jpeg"}):null;
}

    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);
    h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);

    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);

function eyeBoxes(p){

ov.onpointerdown=e=>{ov.setPointerCapture(e.pointerId);stroke={r:$("gsize").value/200,pts:[pt(e)]};drawOv();};
ov.onpointermove=e=>{if(stroke){stroke.pts.push(pt(e));drawOv();}};
ov.onpointerup=async()=>{if(!stroke)return;cur.glare.strokes.push(stroke);stroke=null;await refresh();msg("Area kilau diperbaiki. Tambah goresan lagi kalau masih ada sisa.");};
addEventListener("resize",()=>{if(brush){placeOv();drawOv();}});

/* ---------- Tombol & input ---------- */
$("file").addEventListener("change",e=>{addFiles(e.target.files);e.target.value="";});
const stage=$("stage");
stage.addEventListener("dragover",e=>{e.preventDefault();stage.classList.add("drag");});
stage.addEventListener("dragleave",()=>stage.classList.remove("drag"));
stage.addEventListener("drop",e=>{e.preventDefault();stage.classList.remove("drag");addFiles(e.dataTransfer.files);});
const hold=v=>()=>{bypass=v;draw();};
$("cmp").addEventListener("pointerdown",hold(true));
["pointerup","pointerleave","pointercancel"].forEach(ev=>$("cmp").addEventListener(ev,hold(false)));
$("reset").onclick=()=>{cur.s=zero();syncUI();draw();};
$("rot").onclick=()=>{cur.rot=(cur.rot+1)%4;cur.mask=null;cur.faces=null;cur.fmask=null;cur._fp=null;cur.glare.strokes=[];select(idx);};
$("syncb").onclick=()=>{let n=0;photos.forEach(p=>{if(p.on&&p!==cur){p.s={...cur.s};p.glare.auto=cur.glare.auto;p.glare.thr=cur.glare.thr;n++;}});msg(`Pengaturan foto ini diterapkan ke ${n} foto lain.`);};
$("chk").onclick=()=>{const all=photos.every(p=>p.on);photos.forEach(p=>p.on=!all);strip();};
addEventListener("keydown",e=>{
  if(e.target.matches("input[type=range],select"))return;
  if(e.key==="ArrowRight")select(idx+1);else if(e.key==="ArrowLeft")select(idx-1);
});
</script>
</body>
</html>
